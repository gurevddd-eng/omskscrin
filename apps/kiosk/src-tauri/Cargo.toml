[package]
name = "stella-kiosk"
version = "0.1.0"
description = "Stella informational kiosk (Tauri shell)"
authors = ["Stella"]
edition = "2021"

[lib]
name = "stella_kiosk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
